<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Taş Mekan Cafe</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Georgia', serif; }
        
        /* Işıltı Yağmuru Efekti için Arka Plan */
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        .container { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        
        .header { text-align: center; color: #f4d03f; padding: 10px; }
        h1 { font-size: 3em; margin: 0; text-shadow: 2px 2px 10px #f4d03f; }
        p { font-size: 1.5em; margin: 5px 0; color: #fff; }
        
        .feed-container { flex-grow: 1; overflow: hidden; margin-top: 10px; border-top: 2px solid #f4d03f; padding-top: 10px; }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <div class="header">
            <h1>Taş Mekan Cafe</h1>
            <p>Anılarınızı bizimle paylaşın!</p>
        </div>
        <div class="feed-container">
            <script src="https://elfsightcdn.com/platform.js" async></script>
            <div class="elfsight-app-14bf924c-965c-4bcc-af15-910444a3ec26" data-elfsight-app-lazy></div>
        </div>
    </div>

    <script>
        // Işıltı Yağmuru Efekti
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        function createParticle() {
            return { x: Math.random() * canvas.width, y: -10, size: Math.random() * 2, speed: Math.random() * 3 + 1 };
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.y += p.speed;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                if (p.y > canvas.height) particles.splice(i, 1);
            });
            if (particles.length < 100) particles.push(createParticle());
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
