<!DOCTYPE html>
<html lang="tr">
<head>

    <title>Tas Mekan Cafe TV</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sol Taraf: Karşılama */
        .sol-taraf { width: 35%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #3c4043; color: #fff3dd; padding: 40px; text-align: center; }
        .sol-taraf h1 { font-size: 3.5em; margin-bottom: 10px; line-height: 1.2; }
        .sol-taraf p { font-size: 1.5em; opacity: 0.8; }
        
        /* Sağ Taraf: Sosyal Medya Akışı */
        .sag-taraf { width: 65%; height: 100%; overflow: hidden; background: #fff; }
    </style>
</head>
<body>

    <div class="sol-taraf">
        <h1>Tas Mekan<br>Cafe'ye<br>Hoşgeldiniz</h1>
        <p>Anılarınızı bizimle paylaşın!</p>
    </div>
    
    <div class="sag-taraf">
        <script src="https://elfsightcdn.com/platform.js" async></script>
        <div class="elfsight-app-5522cb1a-3d60-4a52-8434-ecc494c8db4f" data-elfsight-app-lazy></div>
    </div>

</body>
</html>
